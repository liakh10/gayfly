<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gay Fly</title>
<meta name="description" content="Gay Fly. He rides wherever you point." />
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/apple-icon.png" />
<link rel="preload" as="image" href="assets/img/hero.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#0d0b0f;--leather:#1a1418;--paper:#f6f1ea;--pink:#ff2fa0;--pinkdeep:#a8106a;--em:#1fc98a;--emdeep:#0e6f4c;--dim:#6f6470;--pad:clamp(14px,2.6vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--ink);color:var(--paper);font-family:"Space Mono",ui-monospace,monospace;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 80% -10%,#3a0f2a,var(--ink) 55%),radial-gradient(ellipse at 0% 100%,#0b2a20,transparent 50%)}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{position:relative;z-index:1;width:min(1080px,100%);margin:0 auto;padding:var(--pad);display:grid;gap:clamp(14px,2.2vw,22px)}
/* a panel: black leather, pink stitching */
.panel{background:var(--leather);color:var(--paper);border:3px solid var(--pink);border-radius:18px;box-shadow:0 0 0 3px var(--ink),0 0 34px rgba(255,47,160,.28),inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;background:#000;border-bottom:2px dashed var(--pink);padding:9px 14px}
.bar b{width:12px;height:12px;border:2px solid var(--pink);border-radius:50%;background:#000}
.bar b:nth-child(2){background:var(--pink)} .bar b:nth-child(3){background:var(--em);border-color:var(--em)}
.face{padding:clamp(16px,2.6vw,28px)}
/* hero */
.hero .face{display:grid;grid-template-columns:minmax(240px,360px) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:center}
.wm{font-family:"Alfa Slab One",serif;font-size:clamp(54px,9.6vw,120px);line-height:.9;letter-spacing:.01em;color:var(--pink);
  text-shadow:0 0 18px rgba(255,47,160,.55),0 3px 0 var(--pinkdeep),0 6px 0 var(--pinkdeep),0 9px 0 #4a0630}
.tag{margin-top:14px;font-size:clamp(15px,1.9vw,19px);color:var(--paper)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 18px;border:2px solid var(--paper);border-radius:999px;background:#000;color:var(--paper);font-family:"Alfa Slab One",serif;font-size:15px;letter-spacing:.03em;transition:transform .1s,box-shadow .1s,background .1s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(255,47,160,.45)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--pink);border-color:var(--pink);color:#fff}
.btn img{width:18px;height:18px;object-fit:contain}
.hero .pic{border:3px solid var(--em);border-radius:18px;overflow:hidden;box-shadow:0 0 28px rgba(31,201,138,.35);transform:rotate(1.5deg);background:#000}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid button{position:relative;display:block;padding:0;border:2px solid #2a2230;border-radius:12px;overflow:hidden;background:#000;transition:transform .2s,border-color .2s,box-shadow .2s}
.grid button:nth-child(4n+1){transform:rotate(-1.2deg)} .grid button:nth-child(4n+2){transform:rotate(.8deg)} .grid button:nth-child(4n+3){transform:rotate(-.6deg)} .grid button:nth-child(4n){transform:rotate(1.1deg)}
.grid button:hover{transform:rotate(0) translateY(-3px) scale(1.03);border-color:var(--pink);box-shadow:0 0 22px rgba(255,47,160,.45);z-index:2}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover}
/* contract */
.ca-block{cursor:pointer}
dl.t{display:grid;gap:8px}
dl.t div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed #3a2f3c}
dl.t dt{font-family:"Alfa Slab One",serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:3px}
dl.t dd{font-weight:700}
.ca{font-weight:700;font-size:15px;word-break:break-all;color:var(--em)}
.note{margin-top:12px;color:var(--dim);font-size:14px}
.end{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:"Alfa Slab One",serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 4px 20px}
/* the ride */
#bike{position:fixed;left:0;top:0;width:150px;height:auto;z-index:40;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6));transform-origin:50% 90%}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:var(--pad);background:rgba(13,11,15,.92)}
.lb.on{display:grid}
.lbin{width:min(960px,100%);background:var(--leather);color:var(--paper);border:3px solid var(--pink);border-radius:18px;box-shadow:0 0 40px rgba(255,47,160,.35);overflow:hidden}
.lb img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
.lbbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 14px;font-family:"Alfa Slab One",serif;font-size:13px}
.lbnav{display:flex;gap:6px;align-items:center}
.lbnav button{width:40px;height:36px;border:2px solid var(--paper);border-radius:999px;background:#000;color:var(--paper);font-size:18px;line-height:1}
.lbnav button:active{transform:translate(1px,1px)}
@media (max-width:820px){
  .hero .face{grid-template-columns:1fr}
  .hero .pic{max-width:320px;margin:0 auto;transform:none;order:-1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  dl.t div{grid-template-columns:1fr}
  .wm{font-size:clamp(58px,17vw,96px)}
  #bike{width:100px}
}
@media (prefers-reduced-motion:reduce){#bike{display:none}}
</style>
</head>
<body>
<img id="bike" src="assets/img/bike.png" alt="" aria-hidden="true" />
<main class="wrap">
  <section class="panel hero">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face">
      <div class="pic"><img src="assets/img/hero.webp" alt="Gay Fly, an emerald bottle fly with a huge mustache, leather cap and vest, leaning on a motorcycle at a gas station" /></div>
      <div>
        <h1 class="wm">Gay<br />Fly</h1>
        <p class="tag">he rides wherever you point</p>
        <div class="acts">
          <a class="btn go" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" />Buy on Pons</a>
          <a class="btn" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="X" style="filter:invert(1)" /></a>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face"><div class="grid" id="grid"></div></div>
  </section>

  <section class="panel ca-block" id="cab" title="Copy contract">
    <div class="bar"><b></b><b></b><b></b></div>
    <div class="face">
      <dl class="t">
        <div><dt>Name</dt><dd data-name>Gay Fly</dd></div>
        <div><dt>Ticker</dt><dd data-ticker>$GAYFLY</dd></div>
        <div><dt>Chain</dt><dd>Robinhood Chain &#183; Pons</dd></div>
        <div><dt>Contract</dt><dd><span class="ca" id="ca">soon</span></dd></div>
      </dl>
      <p class="note" id="cp">tap to copy</p>
      <div class="acts">
        <a class="btn go" data-link="pons" href="https://www.ponsfamily.com/launchpad"><img src="assets/img/pons.png" alt="" />Buy on Pons</a>
        <a class="btn" data-link="dex" href="https://dexscreener.com/robinhood">Chart</a>
        <a class="btn" data-link="x" href="https://x.com" aria-label="X"><img src="assets/img/x.svg" alt="X" style="filter:invert(1)" /></a>
      </div>
    </div>
  </section>

  <div class="end"><span data-name>Gay Fly</span><span>not financial advice</span></div>
</main>

<div class="lb" id="lb"><div class="lbin"><img id="lbimg" src="" alt="" /><div class="lbbar"><span class="lbnav"><button id="lbprev" aria-label="Previous">&#8249;</button><span id="lbn" style="padding:0 6px"></span><button id="lbnext" aria-label="Next">&#8250;</button><button id="lbx" aria-label="Close">&#10005;</button></span></div></div></div>

<script>
(function(){
  var S = window.SITE, CA = (S.CA || "SOON").trim(), HAS = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.querySelectorAll('[data-ticker]').forEach(function(e){ e.textContent = S.TICKER; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="dex"]').forEach(function(a){ a.href = HAS ? window.DEX_HOME + '/' + CA : window.DEX_HOME; a.target = '_blank'; a.rel = 'noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target = '_blank'; a.rel = 'noopener'; });

  /* contract */
  var ca = document.getElementById('ca'), cp = document.getElementById('cp');
  ca.textContent = HAS ? CA : 'soon';
  document.getElementById('cab').addEventListener('click', function(){ var old = cp.textContent; if(HAS){ if(navigator.clipboard) navigator.clipboard.writeText(CA); cp.textContent = 'copied'; } else cp.textContent = 'not yet'; setTimeout(function(){ cp.textContent = old; }, 1300); });

  /* gallery */
  var G = ['gym','brunch','highway','barber','sauna','disco','park','beach','market','laundry','rooftop','carwash'];
  var grid = document.getElementById('grid'), cur = 0;
  grid.innerHTML = G.map(function(n, i){ return '<button data-i="' + i + '" aria-label="Open"><img src="assets/img/t-' + n + '.webp" loading="lazy" alt="" /></button>'; }).join('');
  var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbn = document.getElementById('lbn');
  function show(i){ cur = (i + G.length) % G.length; lbimg.src = 'assets/img/' + G[cur] + '.webp'; lbn.textContent = (cur + 1) + ' / ' + G.length; lb.classList.add('on'); }
  grid.addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) show(+b.dataset.i); });
  document.getElementById('lbprev').onclick = function(){ show(cur - 1); };
  document.getElementById('lbnext').onclick = function(){ show(cur + 1); };
  document.getElementById('lbx').onclick = function(){ lb.classList.remove('on'); };
  lb.addEventListener('click', function(e){ if(e.target === lb) lb.classList.remove('on'); });
  addEventListener('keydown', function(e){ if(!lb.classList.contains('on')) return; if(e.key === 'Escape') lb.classList.remove('on'); if(e.key === 'ArrowLeft') show(cur - 1); if(e.key === 'ArrowRight') show(cur + 1); });

  /* the ride: he cruises the page and pulls up where you tap */
  var bike = document.getElementById('bike'), x = -200, y = innerHeight * .78, vx = 0, vy = 0, tx, ty, stop = 0, last = performance.now(), dir = 1, bob = 0;
  function pick(){ tx = 80 + Math.random() * (innerWidth - 160); ty = innerHeight * (.55 + Math.random() * .35); }
  pick();
  addEventListener('pointerdown', function(e){ if(e.target.closest('a,button')) return; tx = e.clientX; ty = e.clientY; stop = 1; });
  function step(now){
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    var dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
    if(stop !== 2){
      var acc = 1500, max = stop ? 1100 : 640;
      vx += (dx / d) * acc * dt; vy += (dy / d) * acc * .35 * dt;
      var sp = Math.hypot(vx, vy); if(sp > max){ vx *= max / sp; vy *= max / sp; }
      vx *= .995; vy *= .96;
      x += vx * dt; y += vy * dt; bob += dt * 22;
      if(Math.abs(vx) > 30) dir = vx > 0 ? 1 : -1;
      if(d < 24){ vx *= .3; vy *= .3; if(stop){ stop = 2; setTimeout(function(){ stop = 0; pick(); }, 2400 + Math.random() * 1600); } else pick(); }
    }
    x = Math.max(-80, Math.min(innerWidth + 80, x)); y = Math.max(60, Math.min(innerHeight - 30, y));
    var w = bike.offsetWidth || 150, h = bike.offsetHeight || 100, lean = stop === 2 ? 0 : Math.max(-10, Math.min(10, -vx * .012)) * dir;
    bike.style.transform = 'translate(' + (x - w / 2) + 'px,' + (y - h * .9 + (stop === 2 ? 0 : Math.sin(bob) * 1.5)) + 'px) scaleX(' + dir + ') rotate(' + lean + 'deg)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
